<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="google-site-verification" content="googled82ff9901477ec4d"><title>Moved</title><link rel="canonical" href="https://poodle-care.github.io/blog.html"><meta name="robots" content="noindex, follow"><meta http-equiv="refresh" content="0; url=/blog.html"><style id="pcx-cut">
:root{--ground:#F4F6F4;--ink:#0F1A1C;--brass:#1F4E5A;--soft:#54686C;--rule:#C9D4D1;--tint:#E7EEEC;--link:#0B5C74;
--display:"Charter","Bitstream Charter","Iowan Old Style",Georgia,serif;
--body:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;--w:1200px;--pad:28px}
.pcx-skip{position:absolute;left:-9999px}.pcx-skip:focus{left:12px;top:12px;z-index:9;background:#fff;padding:10px 14px;border:1px solid var(--rule)}
.pcx-top{background:var(--ink);color:#EEF3F2}
.pcx-top-in{max-width:var(--w);margin:0 auto;padding:0 20px;min-height:62px;display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap}
.pcx-mark,.pcx-mark:visited{color:#fff;text-decoration:none;font:600 20px/1 var(--display);letter-spacing:.01em;display:flex;align-items:center;gap:9px;min-height:44px}
.pcx-mark i{display:inline-block;width:0;height:0;border-left:12px solid #8FD3C7;border-top:7px solid transparent;border-bottom:7px solid transparent}
.pcx-nav{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 0}
.pcx-nav a,.pcx-nav a:visited{color:#C8D6D3;text-decoration:none;padding:12px 13px;display:block;font-size:14.5px}
.pcx-nav a:hover,.pcx-nav a[aria-current]{color:#fff;background:var(--brass)}
.pcx-sheet{margin-left:auto;display:none;position:relative}
.pcx-sheet summary{list-style:none;cursor:pointer;color:#fff;border:1px solid #45606A;padding:9px 12px;font-size:14px}
.pcx-sheet summary::-webkit-details-marker{display:none}
.pcx-sheet nav{position:absolute;right:0;top:46px;background:var(--ground);border:1px solid var(--rule);min-width:230px;z-index:8;padding:8px 0}
.pcx-sheet nav a{display:block;padding:11px 16px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
@media(max-width:800px){.pcx-nav{display:none}.pcx-sheet{display:block}}
.pcx-hero{background:linear-gradient(0deg,#E9EFED,#F4F6F4)}
.pcx-hero-in{max-width:var(--w);margin:0 auto;padding:44px 20px 34px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:36px;align-items:center}
.pcx-eyebrow{margin:0 0 10px;font:600 12px/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
.pcx-hero h1{margin:0 0 14px;font:600 clamp(30px,4.2vw,50px)/1.1 var(--display);letter-spacing:-.01em}
.pcx-hero p{margin:0 0 20px;font-size:19px;color:var(--soft);max-width:560px}
.pcx-go,.pcx-go:visited{display:inline-block;background:var(--brass);color:#fff;text-decoration:none;padding:13px 20px;font-weight:600}
.pcx-go:hover{background:#173F49}
.pcx-quiet{margin-left:16px;font-weight:600}
@media(max-width:840px){.pcx-hero-in{grid-template-columns:1fr}}
.pcx-blk{max-width:var(--w);margin:0 auto;padding:38px 20px}
.pcx-blk h2{margin:0 0 6px;font:600 clamp(24px,3vw,32px)/1.2 var(--display)}
.pcx-blk .pcx-lead{margin:0 0 22px;color:var(--soft);max-width:720px}
.pcx-video{margin:0}
.pcx-video a,.pcx-video a:visited{display:block;color:inherit;text-decoration:none}
.pcx-poster{display:block;position:relative;aspect-ratio:16/9;background:center/cover no-repeat #12262B;border:1px solid var(--rule)}
.pcx-play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:34px;text-shadow:0 2px 8px #0008;background:linear-gradient(transparent 40%,#0007)}
.pcx-video b{display:block;margin-top:10px;font-size:16px}
.pcx-video small{display:block;margin-top:3px;font-size:12.5px;color:var(--soft);letter-spacing:.02em}
.pcx-hero .pcx-poster{border:1px solid #9FB6B2}
.pcx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.pcx-path{display:block;border-top:3px solid var(--brass);padding:16px 0 0}
.pcx-path b{display:block;font:600 19px/1.3 var(--display);margin-bottom:6px}
.pcx-path span{color:var(--soft);display:block;margin-bottom:10px}
.pcx-path a{font-weight:600}
.pcx-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.pcx-list li{border-bottom:1px solid var(--rule);max-width:900px}
.pcx-list a,.pcx-list a:visited{display:block;padding:15px 0;color:var(--ink);text-decoration:none}
.pcx-list a:hover{color:var(--link)}
.pcx-list time{display:block;margin-top:4px;font-size:12.5px;color:var(--soft);letter-spacing:.03em}
.pcx-foot{background:var(--ink);color:#BFCFCC;margin-top:48px}
.pcx-foot-in{max-width:var(--w);margin:0 auto;padding:32px 20px;display:flex;gap:28px;flex-wrap:wrap;justify-content:space-between}
.pcx-foot a,.pcx-foot a:visited{color:#CFDCD9;text-decoration:none;margin-right:18px;font-size:14px;display:inline-block;padding:6px 0}
.pcx-foot a:hover{color:#fff;text-decoration:underline}
.pcx-foot p{margin:0;font-size:13px;max-width:520px}
@media print{.pcx-top,.pcx-foot,.pcx-sheet{display:none!important}}
</style>
</head><body><p><a href="/blog.html">https://poodle-care.github.io/blog.html</a></p></body></html>
